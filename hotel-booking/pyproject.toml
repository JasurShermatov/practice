[project]
name = "hotel-booking"
version = "0.3.0"
description = "Hotel booking app for the Advanced Software Design & Architecture course (grows from P03 on)."
requires-python = ">=3.12"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["hotel_booking", "main.py"]

[project]
name = "hotel-booking"
version = "0.9.0"
description = "Hotel booking app for the Advanced Software Design & Architecture course (grows from P03 on)."
requires-python = ">=3.12"
dependencies = ["starlette>=1.0", "pydantic>=2.11", "uvicorn>=0.30"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

# The module borders (P06) live in .importlinter, which `lint-imports` reads
# automatically and tests/test_architecture.py parses too. The course reference
# keeps them here under [tool.importlinter]; they are kept in ONE place so the
# two checkers can never disagree.

[tool.pytest.ini_options]
testpaths = ["tests", "test_booking_service.py", "test_api.py"]
pythonpath = ["."]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "hotel_booking", "main.py", "capacity.py", "test_booking_service.py", "test_api.py",
    "tests/test_substitution.py", "tests/test_dependency_rule.py",
    "tests/test_architecture.py", "tests/test_modules.py",
    "tools/measure.py", "tests/test_cache.py", "tests/test_api_cache.py", "tests/test_redis_store.py",
    "tests/test_cache_wiring.py", "tests/test_measure.py",
    "tests/test_concurrency.py", "tools/race_http.py",
]
